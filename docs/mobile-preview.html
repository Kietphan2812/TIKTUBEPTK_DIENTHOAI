<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TIKTUBE mobile preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: #17181c;
      font-family: system-ui, sans-serif;
      color: #fff;
    }
    .phone {
      width: 392px;
      height: 836px;
      padding: 14px;
      border-radius: 42px;
      background: #050506;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
    }
    .screen {
      width: 364px;
      height: 808px;
      overflow: hidden;
      border-radius: 30px;
      background: #fff;
    }
    iframe {
      width: 364px;
      height: 808px;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <iframe src="/?preview=mobile" title="TIKTUBE mobile"></iframe>
    </div>
  </div>
</body>
</html>
